<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - LuxeGlow Salon</title>
    <link rel="stylesheet" href="/css/auth.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <!-- Logo/Branding (Optional) -->
        <div class="logo-text" style="margin-bottom: 20px">
          <span class="logo-main">LuxeGlow</span>
          <span class="logo-sub">Admin Portal</span>
        </div>

        <h1 class="auth-title">Admin Access</h1>
        <p class="auth-subtitle">Enter your secret key to continue</p>

        <!-- Error/Success Message -->
        <div id="adminMsg" class="auth-msg" style="display: none"></div>

        <!-- Admin Login Form -->
        <form id="adminLoginForm">
          <div class="field">
            <label for="secretKey">Secret Key</label>
            <input
              type="password"
              id="secretKey"
              placeholder="Enter admin secret key"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="primary-btn" id="loginBtn">
            <span id="btnText">Access Dashboard</span>
            <span id="btnLoader" style="display: none">
              <span class="loader-inline"></span>
            </span>
          </button>
        </form>

        <!-- Back to User Login -->
        <p class="switch-text">
          Not an admin?
          <a href="/login.html">User Login</a>
        </p>
      </div>

      <!-- Back to Home Link -->
      <div class="back-home">
        <a href="/index.html">
          <span>←</span>
          <span>Back to Home</span>
        </a>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:3003";

      // Get DOM elements
      const form = document.getElementById("adminLoginForm");
      const secretKeyInput = document.getElementById("secretKey");
      const adminMsg = document.getElementById("adminMsg");
      const loginBtn = document.getElementById("loginBtn");
      const btnText = document.getElementById("btnText");
      const btnLoader = document.getElementById("btnLoader");

      // Show message function
      function showMessage(message, type) {
        adminMsg.textContent = message;
        adminMsg.className = `auth-msg ${type}`;
        adminMsg.style.display = "block";

        // Auto-hide after 5 seconds
        setTimeout(() => {
          adminMsg.style.display = "none";
        }, 5000);
      }

      // Handle form submission
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const secretKey = secretKeyInput.value.trim();

        // Validate input
        if (!secretKey) {
          showMessage("Please enter the secret key", "error");
          return;
        }

        // Show loading state
        loginBtn.disabled = true;
        btnText.style.display = "none";
        btnLoader.style.display = "inline-block";

        try {
          const response = await fetch(`${API_URL}/admin/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ secretKey }),
          });

          const data = await response.json();

          if (response.ok) {
            // Success - store token and redirect
            localStorage.setItem("adminToken", data.token);
            showMessage("Login successful! Redirecting...", "success");

            // Redirect after a short delay
            setTimeout(() => {
              window.location.href = "/admin/admin-dashboard.html";
            }, 1000);
          } else {
            // Error from server
            showMessage(data.message || "Invalid secret key", "error");

            // Reset button state
            loginBtn.disabled = false;
            btnText.style.display = "inline";
            btnLoader.style.display = "none";

            // Clear the input
            secretKeyInput.value = "";
            secretKeyInput.focus();
          }
        } catch (error) {
          console.error("Login error:", error);
          showMessage(
            "Connection failed. Please check your internet connection.",
            "error"
          );

          // Reset button state
          loginBtn.disabled = false;
          btnText.style.display = "inline";
          btnLoader.style.display = "none";
        }
      });

      // Check if already logged in
      window.addEventListener("DOMContentLoaded", () => {
        const adminToken = localStorage.getItem("adminToken");
        if (adminToken) {
          // Verify token is still valid (optional)
          // For now, just redirect
          window.location.href = "/admin/admin-dashboard.html";
        }
      });

      // Add Enter key support
      secretKeyInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          form.dispatchEvent(new Event("submit"));
        }
      });
    </script>
  </body>
</html>
