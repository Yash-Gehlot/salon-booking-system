<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Salon Booking System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <div class="logo">
          <h2>✂️ Glamour Salon</h2>
        </div>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/services">Services</a></li>
          <li><a href="/dashboard">Dashboard</a></li>
          <li><a href="/appointments">My Appointments</a></li>
          <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
      </div>
    </nav>

    <div class="page-header">
      <div class="container">
        <h1>Welcome, <span id="userName">User</span>!</h1>
        <p>Manage your profile and appointments</p>
      </div>
    </div>

    <div class="container">
      <div class="dashboard-grid">
        <div class="dashboard-card">
          <h3>Profile Information</h3>
          <form id="profileForm">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" disabled />
            </div>
            <div class="form-group">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" name="phone" />
            </div>
            <div class="success-message" id="profileSuccess"></div>
            <div class="error-message" id="profileError"></div>
            <button type="submit" class="btn btn-primary">
              Update Profile
            </button>
          </form>
        </div>

        <div class="dashboard-card">
          <h3>Change Password</h3>
          <form id="passwordForm">
            <div class="form-group">
              <label for="currentPassword">Current Password</label>
              <input
                type="password"
                id="currentPassword"
                name="currentPassword"
                required
              />
            </div>
            <div class="form-group">
              <label for="newPassword">New Password</label>
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                required
                minlength="6"
              />
            </div>
            <div class="form-group">
              <label for="confirmNewPassword">Confirm New Password</label>
              <input
                type="password"
                id="confirmNewPassword"
                name="confirmNewPassword"
                required
              />
            </div>
            <div class="success-message" id="passwordSuccess"></div>
            <div class="error-message" id="passwordError"></div>
            <button type="submit" class="btn btn-primary">
              Change Password
            </button>
          </form>
        </div>

        <div class="dashboard-card">
          <h3>Quick Actions</h3>
          <div class="quick-actions">
            <a href="/booking" class="btn btn-primary btn-block"
              >Book New Appointment</a
            >
            <a href="/appointments" class="btn btn-secondary btn-block"
              >View All Appointments</a
            >
            <a href="/services" class="btn btn-secondary btn-block"
              >Browse Services</a
            >
          </div>
        </div>

        <div class="dashboard-card">
          <h3>Upcoming Appointments</h3>
          <div id="upcomingAppointments">
            <div class="loading">Loading...</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "{}");

      if (!token) {
        window.location.href = "/login";
      }

      document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "/";
      });

      // Load user profile
      async function loadProfile() {
        try {
          const response = await fetch("/api/users/profile", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await response.json();

          if (data.success) {
            document.getElementById("userName").textContent = data.data.name;
            document.getElementById("name").value = data.data.name;
            document.getElementById("email").value = data.data.email;
            document.getElementById("phone").value = data.data.phone || "";
          }
        } catch (error) {
          console.error("Error loading profile:", error);
        }
      }

      // Update profile
      document
        .getElementById("profileForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const profileSuccess = document.getElementById("profileSuccess");
          const profileError = document.getElementById("profileError");
          profileSuccess.textContent = "";
          profileError.textContent = "";

          const formData = {
            name: document.getElementById("name").value,
            phone: document.getElementById("phone").value,
          };

          try {
            const response = await fetch("/api/users/profile", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify(formData),
            });

            const data = await response.json();

            if (response.ok) {
              profileSuccess.textContent = "Profile updated successfully!";

              // Update local storage
              const updatedUser = { ...user, ...formData };
              localStorage.setItem("user", JSON.stringify(updatedUser));
              document.getElementById("userName").textContent = formData.name;
            } else {
              profileError.textContent =
                data.message || "Failed to update profile";
            }
          } catch (error) {
            profileError.textContent = "An error occurred. Please try again.";
            console.error("Profile update error:", error);
          }
        });

      // Change password
      document
        .getElementById("passwordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const passwordSuccess = document.getElementById("passwordSuccess");
          const passwordError = document.getElementById("passwordError");
          passwordSuccess.textContent = "";
          passwordError.textContent = "";

          const currentPassword =
            document.getElementById("currentPassword").value;
          const newPassword = document.getElementById("newPassword").value;
          const confirmNewPassword =
            document.getElementById("confirmNewPassword").value;

          if (newPassword !== confirmNewPassword) {
            passwordError.textContent = "New passwords do not match";
            return;
          }

          try {
            const response = await fetch("/api/users/password", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ currentPassword, newPassword }),
            });

            const data = await response.json();

            if (response.ok) {
              passwordSuccess.textContent = "Password changed successfully!";
              document.getElementById("passwordForm").reset();
            } else {
              passwordError.textContent =
                data.message || "Failed to change password";
            }
          } catch (error) {
            passwordError.textContent = "An error occurred. Please try again.";
            console.error("Password change error:", error);
          }
        });

      // Load upcoming appointments
      async function loadUpcomingAppointments() {
        try {
          const response = await fetch("/api/appointments", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await response.json();
          const container = document.getElementById("upcomingAppointments");

          if (data.success && data.data.length > 0) {
            const upcoming = data.data
              .filter(
                (apt) =>
                  (apt.status === "pending" || apt.status === "confirmed") &&
                  new Date(apt.appointmentDate) >= new Date()
              )
              .slice(0, 3);

            if (upcoming.length > 0) {
              container.innerHTML = upcoming
                .map(
                  (apt) => `
                            <div class="mini-appointment-card">
                                <h4>${apt.service.name}</h4>
                                <p>${new Date(
                                  apt.appointmentDate
                                ).toLocaleDateString()} at ${
                    apt.appointmentTime
                  }</p>
                                <p>with ${apt.staff.user.name}</p>
                            </div>
                        `
                )
                .join("");
            } else {
              container.innerHTML = "<p>No upcoming appointments</p>";
            }
          } else {
            container.innerHTML = "<p>No upcoming appointments</p>";
          }
        } catch (error) {
          console.error("Error loading appointments:", error);
          document.getElementById("upcomingAppointments").innerHTML =
            "<p>Error loading appointments</p>";
        }
      }

      loadProfile();
      loadUpcomingAppointments();
    </script>
  </body>
</html>
